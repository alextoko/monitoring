<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Monitoring Suhu Oli</title>

<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="header">MONITORING LUBRICATING OIL TEMPERATURE</div>

<div class="wrapper">

  <!-- ATAS -->
  <div class="section top">

    <div class="panel">
      <div class="title">TEMPERATURE</div>

      <div class="temp" id="temp">0.0°C</div>

      <div class="row">
        <div class="box yellow" id="clock">00:00:00</div>
        <div class="box">TEMP ALARM ON</div>
        <div class="box" id="setDisplay">0°C</div>
        <div class="box yellow" onclick="setAlarm()">SET</div>
      </div>

      <div class="row">
        <div class="box green">RPM</div>
        <div class="box" id="pwm">0</div>
        <div class="box green">PWM %</div>
        <div class="box" id="duty">0%</div>
      </div>
    </div>

    <div class="panel">
      <div class="title">STATUS</div>

      <div class="row"><div class="box">MAXIMUM TEMPERATURE</div><div class="box" id="max">0°C</div></div>
      <div class="row"><div class="box">MINIMUM TEMPERATURE</div><div class="box" id="min">0°C</div></div>
      <div class="row"><div class="box">DEVICE STATUS</div><div class="box" id="avg">0</div></div>
      <div class="row"><div class="box">ALARM STATUS</div><div class="box" id="alarm">OFF/ON</div></div>
      <div class="row"><div class="box">ESP IP ADDRESS</div><div class="box" id="ip">0.0.0.0</div></div>
    </div>

  </div>

  <!-- BAWAH -->
  <div class="section bottom">

    <div class="panel">
      <div class="title">TEMPERATURE DATA HISTORY</div>
      <div id="logTable"></div>
    </div>

    <div class="panel">
      <div class="title">24-HOUR TEMPERTURE CHART</div>
      <canvas id="chart"></canvas>
    </div>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script type="module" src="app.js"></script>

</body>
</html>
